<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framed Height Prediction:</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'SF Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: {{BACKGROUND_COLOR}};
            color: #000;
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .frame-container {
            width: 100%;
            min-height: 100vh;
            background-color: {{BACKGROUND_COLOR}};
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 100px 120px 200px 120px;
            box-sizing: border-box;
        }

        .title {
            color: #000;
            font-size: 120px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 60px;
        }

        .image-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 60px 0;
            min-height: 0;
            width: 100%;
            padding: 20px;
        }

        .framed-image {
            max-width: 80%;
            max-height: 80%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .footer {
            color: #000;
            font-size: 90px;
            font-weight: bold;
            text-align: center;
            margin-top: 60px;
        }
    </style>
</head>
<body>
    <div class="frame-container">
        <div class="title">Final Height Prediction:</div>
        <div class="image-container">
            <img class="framed-image" src="{{IMAGE_DATA}}" alt="Height Prediction" />
        </div>
        <div class="footer">Search GoTall for your own prediction</div>
    </div>
</body>
</html>
