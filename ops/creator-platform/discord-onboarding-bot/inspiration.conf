[Service]
Environment=GOTALL_INSPIRATION_ENABLED=true
Environment=GOTALL_INSPIRATION_FEED_ENABLED=true
Environment=PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome
Environment=PUPPETEER_CACHE_DIR=/var/lib/gotall-discord-onboarding-test/puppeteer
LoadCredentialEncrypted=inspiration-openai-key:/etc/credstore.encrypted/gotall-inspiration-openai-key.cred
LoadCredentialEncrypted=inspiration-viral-key:/etc/credstore.encrypted/gotall-inspiration-viral-key.cred

Environment=XDG_CONFIG_HOME=/var/lib/gotall-discord-onboarding-test/chrome/config
Environment=XDG_CACHE_HOME=/var/lib/gotall-discord-onboarding-test/chrome/cache
